[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jebena-python-client"
description = "Simple Python Client for the Jebena API Server"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MPL-2.0" }
authors = [
    { name = "Jeff Potter", email = "jeffpotter+jebenaclient@jebena.org" },
]
keywords = ["graphql", "gql", "jebena", "api-client"]
# The client deliberately depends on nothing outside the standard library, so that
# the single .py file can also be dropped straight into another repo. Keep it that way.
dependencies = []
# Single-sourced from jebenaclient/__init__.py, so it can no longer drift:
dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/jebena/jebena-python-client"
Issues = "https://github.com/jebena/jebena-python-client/issues"

[tool.setuptools]
packages = ["jebenaclient"]

[tool.setuptools.dynamic]
version = { attr = "jebenaclient.__version__" }

[tool.flake8]
max-line-length = 120
